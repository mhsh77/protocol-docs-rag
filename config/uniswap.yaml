# Corpus + pipeline configuration for the Uniswap developer docs.
# To point the pipeline at another protocol, copy this file and change the `corpus` block.

corpus:
  name: uniswap
  # GitHub repo holding the docs source. Pinned to a commit so every run sees identical text.
  repo: Uniswap/docs
  commit: 1c7597d73be0e9a3a4e44aa75b8fb212b40ea136
  license: MIT
  # Only files under these prefixes are fetched (repo-relative).
  include_prefixes:
    - content/get-started/
    - content/trading/
    - content/liquidity/
    - content/protocols/
    - content/sdks/
    - content/uniswap-ai/
    - content/unichain/
    - content/ecosystem/
    - content/community/
  # Excluded from the corpus: `archive/` (superseded docs), `examples/` (code only),
  # `changelog/` (time-bound notices that would make the eval date-sensitive).
  exclude_prefixes: []
  extensions: [".md", ".mdx"]
  # How a repo path maps to the published page. `{path}` is the repo path with
  # `strip_prefix` and the extension removed; a trailing `/index` is dropped.
  strip_prefix: content/
  published_url_template: "https://developers.uniswap.org/docs/{path}"
  license_file: LICENSE

chunking:
  # Chosen by the chunk-size experiment: docs/experiments/chunk_size.md
  max_tokens: 256
  overlap_tokens: 32
  min_section_tokens: 0   # merging small sections did not help measurably
  max_code_tokens: 1024

embedding:
  model: BAAI/bge-base-en-v1.5

retrieval:
  mode: hybrid_rerank      # dense | hybrid | hybrid_rerank
  top_k: 5
  dense_candidates: 30
  bm25_candidates: 30
  rrf_k: 60
  rerank_candidates: 20
  reranker_model: cross-encoder/ms-marco-MiniLM-L-12-v2   # see docs/experiments/retrieval.md

generation:
  protocol_name: Uniswap
  prompt_version: answer_v2
  temperature: 0.0
  citation_check: true
  max_citation_retries: 1
  require_sentence_coverage: false   # measured, not enforced (see config.py comment)
  on_violation: abstain        # flag | abstain
  min_rerank_score: null       # tuned on the dev split only

bot_limits:
  per_user_per_minute: 4
  per_user_per_day: 30
  global_per_day: 150     # keeps the bot inside the free-tier daily LLM token quota
