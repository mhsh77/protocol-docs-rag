[project]
name = "docrag"
version = "0.1.0"
description = "Evaluated RAG assistant for a DeFi protocol's documentation, with measured hallucination and abstention."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "bm25s>=0.3.11",
    "google-genai>=2.26.0",
    "httpx>=0.27",
    "markdown-it-py>=4.2.0",
    "numpy>=2.4.6",
    "openai>=3.22.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "structlog>=24.1",
    "tokenizers>=0.23.2",
    "torch>=2.14.1",
    "typer>=0.12",
]

[project.scripts]
rag = "docrag.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM905"]  # "a b c".split() word lists are more readable than list literals

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

# CPU-only PyTorch everywhere (no CUDA download in Docker / on the VPS).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.mypy.overrides]]
module = ["bm25s.*", "qdrant_client.*", "sentence_transformers.*"]
ignore_missing_imports = true
